<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -60 520 380" role="img" aria-labelledby="title desc">
  <title id="title">Subtle five-bar rising chart</title>
  <desc id="desc">A decorative set of five wider rising gold bars for use as a background image.</desc>

  <defs>
    <linearGradient id="barGradient" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#8f6824" stop-opacity="0.12" />
      <stop offset="42%" stop-color="#c9a24a" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#fad87d" stop-opacity="0.46" />
    </linearGradient>

    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.75" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

<g opacity="0.92" filter="url(#softGlow)">
  <path d="M38 274 L38 227 L98 197 L98 274 Z" fill="url(#barGradient)"/>
  <path d="M124 274 L124 179 L184 135 L184 274 Z" fill="url(#barGradient)"/>
  <path d="M210 274 L210 123 L270 68 L270 274 Z" fill="url(#barGradient)"/>
  <path d="M296 274 L296 59 L356 2 L356 274 Z" fill="url(#barGradient)"/>
  <path d="M382 274 L382 -4 L442 -55 L442 274 Z" fill="url(#barGradient)"/>
</g>

  <path d="M34 274H458" stroke="#c9a24a" stroke-opacity="0.14" stroke-width="2" />
</svg>